<?xml version="1.0" encoding="UTF-8"?>
<!-- Boson primary lockup (Title Case) — use on dark backgrounds. -->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="48" viewBox="0 0 280 48" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Boson Network</title>
  <desc id="desc">Boson Network horizontal lockup on dark background.</desc>

  <defs>
    <linearGradient id="boson-core-lockup-dark" x1="12.6" y1="12.6" x2="19.4" y2="19.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7F3F0"/>
      <stop offset="1" stop-color="#14B8C9"/>
    </linearGradient>
    <linearGradient id="boson-node-lockup-dark" x1="4.4" y1="13.9" x2="27.6" y2="18.1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C3C9FF"/>
      <stop offset="1" stop-color="#8F7BFF"/>
    </linearGradient>
    <filter id="boson-halo-lockup-dark" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>


  <g transform="translate(6, 6) scale(1.125)">
    <g stroke="#8BE9DE" stroke-width="1">
      <circle cx="16" cy="16" r="14.5" stroke-opacity=".6"/>
      <ellipse cx="16" cy="16" rx="14.5" ry="6.2" stroke-opacity=".34"/>
    </g>
    <path d="M8.8 16h4.8m4.8 0h4.8" stroke="#8BE9DE" stroke-width="1.3" stroke-linecap="round"/>
    <g filter="url(#boson-halo-lockup-dark)" opacity=".85">
      <circle cx="16" cy="16" r="4.65" fill="#3FE0DC"/>
      <circle cx="6.5" cy="16" r="3.2" fill="#A48FFF"/>
      <circle cx="25.5" cy="16" r="3.2" fill="#A48FFF"/>
    </g>
    <circle cx="16" cy="16" r="3.4" fill="url(#boson-core-lockup-dark)"/>
    <circle cx="6.5" cy="16" r="2.1" fill="url(#boson-node-lockup-dark)"/>
    <circle cx="25.5" cy="16" r="2.1" fill="url(#boson-node-lockup-dark)"/>
  </g>

  <text x="56" y="30.5" style="font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-weight:700;font-size:21px;letter-spacing:-0.02em;fill:#F8FAFC">Boson <tspan style="font-weight:400;fill:#8BE9DE">Network</tspan></text>
</svg>
